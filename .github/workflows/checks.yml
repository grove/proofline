name: Proofline deterministic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Read the immutable published-study runtime, not mutable main.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline boundary and receipt regressions
        run: python -B -m unittest discover -s tests -v
      - name: Fixed behavioral oracle controls
        run: python -B checks/fixtures/s0/test_oracle.py

  skills-install:
    # Packaging smoke only: the separate deterministic-checks job stays offline.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Discover and copy the skill using the public installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-consumer"
          cd "$RUNNER_TEMP/skill-consumer"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list > found.txt
          grep -Fq "proofline-check" found.txt
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill proofline-check -a codex --copy -y
          test -f .agents/skills/proofline-check/SKILL.md
          grep -Fq 'name: proofline-check' .agents/skills/proofline-check/SKILL.md
