name: One-time Proofline issue 59 native Node/OpenSSL probe

# Run once on this branch and remove before the reviewable patch.
on:
  push:
    branches: [fix/macos-openssl-read-probe]
    paths: [.github/workflows/issue59-native.yml]

permissions:
  contents: read

jobs:
  native:
    name: Bounded native Node startup and two frozen RepoTend checks
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout Proofline branch under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
      - name: Checkout frozen RepoTend implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/repotend
          ref: ead77fde6a5a7ba33e54cc81deb76fced8dbc333
          path: source
          persist-credentials: false
      - name: Checkout original audited Intentline export evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grove/repotend
          ref: cba5c66754c4e27e06d29363c8a52060ccdc5c2e
          path: evidence
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Node exactly 22.16.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.16.0'
      - name: Install pinned native Codex CLI without changing sandbox settings
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.162.1 --ignore-scripts --no-audit --no-fund
          case "$(uname -m)" in
            arm64) triple=aarch64-apple-darwin ;;
            x86_64) triple=x86_64-apple-darwin ;;
            *) echo 'Unsupported architecture'; exit 2 ;;
          esac
          native="$(find "$(npm root -g)/@openai" -type f -path "*/vendor/$triple/bin/codex" -print -quit)"
          test -n "$native"
          test -x "$native"
          mkdir -p "$RUNNER_TEMP/proofline59-bin"
          ln -s "$native" "$RUNNER_TEMP/proofline59-bin/codex"
          echo "$RUNNER_TEMP/proofline59-bin" >> "$GITHUB_PATH"
          test "$("$native" --version)" = 'codex-cli 0.162.1'
      - name: Observe native startup, original R1, R1+R2 and invalid mapping
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B tool/checks/issue59_native_probe.py
      - name: Preserve all observed receipts even after errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofline-59-native-probe
          path: proofline-59-records/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
